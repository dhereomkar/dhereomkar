<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Omkar Dhere - Aspiring Cloud and DevOps Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a66c2"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>

  <!-- animated waves -->
  <path fill="#ffffff" fill-opacity="0.08" d="M0 160 Q125 120 250 160 T500 160 T750 160 T1000 160 T1250 160 T1500 160 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <path fill="#ffffff" fill-opacity="0.12" d="M0 180 Q125 150 250 180 T500 180 T750 180 T1000 180 T1250 180 T1500 180 V220 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" opacity="0">
    Omkar Dhere
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#e6edf3" opacity="0">
    Aspiring Cloud &amp; DevOps Engineer
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
  </text>
</svg>
